services:
  - name: arc-api
    type: web
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env="$INFISICAL_ENV" --token="$INFISICAL_TOKEN" --command='pnpm db:migration:up && pnpm start:prod'
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENV
        value: prod
      - key: INFISICAL_TOKEN
        sync: false
      - key: INFISICAL_DISABLE_UPDATE_CHECK
        value: "true"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CACHE_DRIVER
        value: redis
      - key: CACHE_TTL
        value: 60s
      - key: RATE_LIMIT_DRIVER
        value: redis
      - key: RATE_LIMIT_LIMIT
        value: "20"
      - key: RATE_LIMIT_TTL
        value: 60s
      - key: RATE_LIMIT_BLOCK_DURATION
        value: 60s
      - key: QUEUE_DRIVER
        value: redis
      - key: QUEUE_NAME
        value: default
      - key: QUEUE_PREFIX
        value: nest-template
      - key: QUEUE_JOB_ATTEMPTS
        value: "5"
      - key: QUEUE_JOB_BACKOFF
        value: 5s
      - key: QUEUE_REMOVE_COMPLETED_AFTER
        value: 1d
      - key: QUEUE_REMOVE_FAILED_AFTER
        value: 7d
      - key: QUEUE_WORKER_CONCURRENCY
        value: "10"
