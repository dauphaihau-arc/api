services:
  - name: arc-api
    type: web
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/dauphaihau-arc/api:latest
      creds:
        fromRegistryCreds:
          name: ghcr-read
    dockerCommand: sh -lc 'pnpm db:migration:up && exec pnpm start:prod'
    healthCheckPath: /health
