services:
  - name: arc-api
    type: web
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/dauphaihau-arc/api:latest
      creds:
        fromRegistryCreds:
          # Name as stored in Render; the trailing period is part of it.
          name: ghcr-read.
    healthCheckPath: /health
    # Deploys are triggered by the CI deploy hook, never by a commit.
    autoDeployTrigger: 'off'
