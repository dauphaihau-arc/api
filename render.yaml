services:
  - name: arc-api
    type: web
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: sh -lc 'pnpm db:migration:up && exec pnpm start:prod'
    healthCheckPath: /health
    autoDeployTrigger: checksPass
