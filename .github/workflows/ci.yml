name: CI

on:
  pull_request:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.0.0
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify OpenAPI spec is current
        run: pnpm spec:generate -- --check

      - name: Test
        run: pnpm test -- --runInBand

      - name: Build
        run: pnpm build

  publish-image:
    needs: validate
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dauphaihau-arc/api:${{ github.sha }}
            ghcr.io/dauphaihau-arc/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # imgURL must be URL-encoded and match the service's image URL outside the tag.
          curl -sS --fail-with-body \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=ghcr.io%2Fdauphaihau-arc%2Fapi%3A${GITHUB_SHA}" \
            -w '\nHTTP %{http_code}\n'
